<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>민정 팀케어카드 한도체크</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* 레이아웃: 설정 바(한도 + 엑셀 2개) → 유통사업부 합계 요약 → 수기 차감 → 카드별 승인내역 */
:root {
  --bg: #f3f5f7;
  --surface: #ffffff;
  --fg: #17212b;
  --muted: #5d6b78;
  --line: #dde3e9;
  --accent: #1f5f8b;
  --ok: #1e7a4c;
  --warn: #b26b00;
  --bad: #c0392b;
  --minus: #8a3ea8;
  --minus-soft: #f3e8f7;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11171d; --surface: #19212a; --fg: #e6ecf1; --muted: #93a2b0; --line: #2b3640;
    --accent: #6cb1e0; --ok: #4cc38a; --warn: #e3a440; --bad: #ef6f61;
    --minus: #c99be0; --minus-soft: #33243d; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11171d; --surface: #19212a; --fg: #e6ecf1; --muted: #93a2b0; --line: #2b3640;
  --accent: #6cb1e0; --ok: #4cc38a; --warn: #e3a440; --bad: #ef6f61;
  --minus: #c99be0; --minus-soft: #33243d; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 48px;
}
.wrap { max-width: 1180px; margin: 0 auto; display: grid; gap: 20px; }
h1 { margin: 0; font-size: 1.6rem; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
.period { color: var(--muted); font-size: .9rem; min-height: 1.4em; }
.period b { color: var(--fg); font-weight: 500; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; min-width: 0; }
.bar { padding: 16px; display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: start; }
.field { display: grid; gap: 4px; }
.field > label, .field > span { font-size: .75rem; color: var(--muted); letter-spacing: .04em; font-weight: 500; }
input[type="text"], input[type="number"], select {
  font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; width: 100%;
}
input:focus-visible, button:focus-visible, select:focus-visible, .upload:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.limit-input { font-family: var(--font-num); text-align: right; width: 200px; }
.slot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.upload { position: relative; display: inline-flex; align-items: center; cursor: pointer; background: var(--accent); color: var(--surface); font-weight: 700; border-radius: 6px; padding: 7px 14px; white-space: nowrap; }
.upload.loaded { background: var(--surface); color: var(--accent); border: 1px solid var(--accent); padding: 6px 13px; }
.upload input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.fname { font-size: .82rem; color: var(--muted); max-width: 260px; overflow-wrap: anywhere; }
.fname b { color: var(--fg); font-weight: 500; }
.hint { font-size: .8rem; color: var(--muted); flex-basis: 100%; margin: 0; }
.err { color: var(--bad); font-weight: 500; }

.summary { padding: 18px; display: grid; gap: 14px; }
.sum-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 12px; }
.remain { display: grid; gap: 2px; }
.remain small { color: var(--muted); font-size: .8rem; }
.remain .big { font-family: var(--font-num); font-size: 2.2rem; font-weight: 600; line-height: 1.15; font-variant-numeric: tabular-nums; }
.remain .big.neg { color: var(--bad); }
.state { font-size: .78rem; font-weight: 700; padding: 3px 10px; border-radius: 99px; }
.state.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent); }
.state.warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 16%, transparent); }
.state.bad { color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, transparent); }
.state.none { color: var(--muted); background: var(--bg); }
.meter { height: 8px; background: var(--bg); border-radius: 99px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }
.meter i.warn { background: var(--warn); } .meter i.bad { background: var(--bad); }
.sum-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 16px 32px; }
.calc { display: grid; grid-template-columns: 1fr auto; gap: 3px 12px; font-size: .88rem; margin: 0; align-content: start; }
.calc dt { color: var(--muted); }
.calc dd { margin: 0; text-align: right; font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.calc .minus { color: var(--minus); }
.calc .total { border-top: 1px solid var(--line); padding-top: 4px; font-weight: 700; color: var(--fg); }

.section { padding: 14px 18px; display: grid; gap: 10px; }
.section h3, .card-head h2 { margin: 0; font-size: .82rem; color: var(--muted); letter-spacing: .04em; font-weight: 700; }
.manual-form { display: grid; grid-template-columns: 1fr 140px auto; gap: 8px; }
.manual-form input[type="number"] { font-family: var(--font-num); text-align: right; }
button { font: inherit; cursor: pointer; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); padding: 6px 12px; }
.btn-minus { background: var(--minus); border-color: var(--minus); color: var(--surface); font-weight: 700; }
.manual-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.manual-list li { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; font-size: .88rem; background: var(--minus-soft); border-radius: 6px; padding: 5px 6px 5px 10px; }
.manual-list .amt { font-family: var(--font-num); color: var(--minus); }
.x { border: 0; background: transparent; color: var(--muted); padding: 2px 8px; }
.empty { color: var(--muted); font-size: .88rem; margin: 0; }
.start { padding: 40px 18px; text-align: center; }

.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); gap: 20px; align-items: start; }
.card { overflow: hidden; }
.card-head { padding: 14px 18px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; border-bottom: 1px solid var(--line); }
.card-head h2 { font-size: 1rem; color: var(--fg); letter-spacing: 0; }
.card-no { font-family: var(--font-num); color: var(--muted); letter-spacing: .06em; font-weight: 500; margin-left: 6px; }
.card-sum { font-family: var(--font-num); font-weight: 600; font-variant-numeric: tabular-nums; }
.card-sum small { display: block; text-align: right; font-family: var(--font-body); font-weight: 400; color: var(--minus); font-size: .75rem; }
.tx-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .88rem; }
td { padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.d { font-family: var(--font-num); color: var(--muted); white-space: nowrap; font-size: .8rem; }
td.m { min-width: 140px; }
td.a { text-align: right; font-family: var(--font-num); font-variant-numeric: tabular-nums; white-space: nowrap; }
td.c { text-align: center; white-space: nowrap; }
.tag { font-size: .68rem; padding: 0 6px; border-radius: 4px; margin-left: 4px; white-space: nowrap; }
.tag.pend { color: var(--warn); border: 1px solid currentColor; }
.tag.cancel { color: var(--muted); border: 1px solid currentColor; }
tr.cancelled td { color: var(--muted); }
tr.cancelled td.a { text-decoration: line-through; }
tr.excluded { background: var(--minus-soft); }
tr.excluded td.a { color: var(--minus); text-decoration: line-through; }
.toggle { font-size: .78rem; padding: 3px 10px; white-space: nowrap; }
tr.excluded .toggle { background: var(--minus); border-color: var(--minus); color: var(--surface); }
@media (max-width: 520px) {
  .manual-form { grid-template-columns: 1fr 110px; }
  .manual-form button { grid-column: 1 / -1; }
  .limit-input { width: 100%; }
  .field { flex-basis: 100%; }
}
@media (prefers-reduced-motion: reduce) { .meter i { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>민정 팀케어카드 한도체크</h1>
    <div class="period" id="period"></div>
  </header>

  <div class="panel bar">
    <div class="field">
      <label for="limit">유통사업부 팀케어 한도 (원)</label>
      <input class="limit-input" id="limit" type="text" inputmode="numeric" autocomplete="off">
    </div>
    <div class="field">
      <span>카드사 엑셀 1</span>
      <div class="slot"><label class="upload" id="up-0" for="file-0">파일 선택<input id="file-0" type="file" accept=".xls,.xlsx,.csv"></label><span class="fname" id="fname-0"></span></div>
    </div>
    <div class="field">
      <span>카드사 엑셀 2</span>
      <div class="slot"><label class="upload" id="up-1" for="file-1">파일 선택<input id="file-1" type="file" accept=".xls,.xlsx,.csv"></label><span class="fname" id="fname-1"></span></div>
    </div>
    <p class="hint" id="hint">카드사 승인내역 엑셀 2개를 올리면 유통사업부 카드 5장(8341 · 5152 · 규림 1645 · 담민 6116 · 은영 0273) 내역만 골라 한도 하나로 합산해요. 파일은 이 브라우저 안에서만 읽고 어디에도 저장하지 않아요.</p>
  </div>

  <div id="main"></div>
</div>

<script>
// 유통사업부 한도에 포함되는 카드 (끝 4자리)
const CARDS = [
  { no: '8341', name: '법인카드' },
  { no: '5152', name: '법인카드' },
  { no: '1645', name: '규림' },
  { no: '6116', name: '담민' },
  { no: '0273', name: '은영' }
];
const CARD_NOS = CARDS.map(c => c.no);

const won = n => (n < 0 ? '-' : '') + Math.abs(Math.round(n)).toLocaleString('ko-KR') + '원';
const minusWon = n => n ? '-' + won(n) : '0원';
const num = s => Number(String(s).replace(/[^\d.-]/g, '')) || 0;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const state = {
  limit: 0,
  files: [null, null],       // { name, period, tx }
  excluded: new Set(),
  manual: []
};

function last4(cell) {
  const d = String(cell).replace(/\D/g, '');
  return d.length >= 4 ? d.slice(-4) : '';
}

function makeTx(date, card, merchant, rawAmt, status, approval) {
  const s = String(rawAmt);
  const m = s.match(/\(\s*-\s*([\d,]+)\s*\)/);        // "29,000 \n (-29,000)" = 승인 후 취소
  const amount = num(s.split(/\n|\(/)[0]);
  const cancelAmt = m ? num(m[1]) : 0;
  const statusCancel = /취소/.test(status) && !/미취소/.test(status);
  const net = statusCancel && amount > 0 ? 0 : amount - cancelAmt;
  return {
    date, card, merchant, amount, net, status,
    cancelled: statusCancel || amount < 0 || (cancelAmt > 0 && cancelAmt >= amount),
    id: card + '|' + (approval || date) + '|' + amount
  };
}

// 카드사마다 엑셀 양식이 달라도 헤더 이름으로 열을 찾음
function findHeader(cells) {
  const find = (...res) => { for (const re of res) { const i = cells.findIndex(c => re.test(c)); if (i >= 0) return i; } return -1; };
  const card = find(/^이용카드/, /카드번호/, /^카드$/, /이용카드/);
  const amt = find(/^승인금액\s*\//, /^승인금액/, /^이용금액/, /^매출금액/, /금액/);
  if (card < 0 || amt < 0) return null;
  return {
    card, amt,
    date: find(/^이용일/, /^승인일/, /^거래일/, /일자/, /일시/),
    appr: find(/^승인번호/),
    merch: find(/가맹점/, /^이용처/),
    status: find(/^접수/, /취소여부/, /^상태/, /승인구분/, /^구분/)
  };
}

function parseSheet(rows) {
  let hdr = null, period = '';
  const tx = [];
  for (const r of rows) {
    const cells = r.map(c => (c == null ? '' : String(c).trim()));
    if (!period) { const p = cells.find(c => /\d{4}[.\-/]\d{1,2}[.\-/]\d{1,2}\s*~\s*\d{4}[.\-/]\d{1,2}[.\-/]\d{1,2}/.test(c)); if (p) period = p; }
    const h = findHeader(cells);
    if (h && !CARD_NOS.includes(last4(cells[h.card]))) { hdr = h; continue; }   // 페이지마다 반복되는 헤더행 포함
    if (!hdr) continue;
    const card = last4(cells[hdr.card]);
    if (!CARD_NOS.includes(card)) continue;
    const pick = i => (i >= 0 ? cells[i] : '');
    tx.push(makeTx(pick(hdr.date), card, pick(hdr.merch), r[hdr.amt], pick(hdr.status), pick(hdr.appr)));
  }
  return { period, tx };
}

function loadFile(slot, file) {
  const hint = document.getElementById('hint');
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
      let period = '', tx = [];
      for (const name of wb.SheetNames) {
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, raw: false, defval: '' });
        const res = parseSheet(rows);
        period = period || res.period; tx = tx.concat(res.tx);
      }
      if (!tx.length) {
        hint.innerHTML = `<span class="err">${esc(file.name)}에서 유통사업부 카드 승인내역을 찾지 못했어요. 카드사 "승인내역 조회" 엑셀이 맞는지 확인해 주세요.</span>`;
        return;
      }
      state.files[slot] = { name: file.name, period, tx };
      hint.textContent = '';
      render();
    } catch (err) {
      hint.innerHTML = `<span class="err">${esc(file.name)} 파일을 읽지 못했어요. 카드사에서 받은 원본 엑셀을 그대로 올려 주세요.</span>`;
    }
  };
  reader.readAsArrayBuffer(file);
}

function allTx() {
  const seen = new Set(), out = [];
  for (const f of state.files) {
    if (!f) continue;
    for (const t of f.tx) { if (seen.has(t.id)) continue; seen.add(t.id); out.push(t); }   // 두 파일에 같은 건이 있으면 한 번만
  }
  return out;
}

function totals(tx) {
  const used = tx.reduce((s, t) => s + t.net, 0);
  const excl = tx.filter(t => state.excluded.has(t.id)).reduce((s, t) => s + t.net, 0);
  return { used, excl, count: tx.filter(t => !t.cancelled).length };
}

function cardHTML(c, list) {
  const t = totals(list);
  const rows = list.map(x => {
    const ex = state.excluded.has(x.id);
    const cls = x.cancelled ? 'cancelled' : ex ? 'excluded' : '';
    const tags = (x.cancelled ? '<span class="tag cancel">취소</span>' : '') + (!x.cancelled && x.status === '미접수' ? '<span class="tag pend">미접수</span>' : '');
    const btn = x.cancelled ? '' : `<button class="toggle" data-id="${esc(x.id)}" aria-pressed="${ex}">${ex ? '제외됨' : '제외'}</button>`;
    return `<tr class="${cls}"><td class="d">${esc(x.date)}</td><td class="m">${esc(x.merchant)}${tags}</td><td class="a">${won(x.amount)}</td><td class="c">${btn}</td></tr>`;
  }).join('');
  return `
  <article class="panel card">
    <div class="card-head">
      <h2>${esc(c.name)}<span class="card-no">${c.no}</span></h2>
      <div class="card-sum">${won(t.used - t.excl)}${t.excl ? `<small>제외 ${minusWon(t.excl)}</small>` : ''}</div>
    </div>
    <div class="tx-wrap"><table><tbody>${rows || '<tr><td class="empty">불러온 파일에 이 카드 내역이 없어요.</td></tr>'}</tbody></table></div>
  </article>`;
}

function render() {
  const loaded = state.files.filter(Boolean);
  state.files.forEach((f, i) => {
    document.getElementById('fname-' + i).innerHTML = f ? `<b>${esc(f.name)}</b> · ${f.tx.length}건` : '';
    const up = document.getElementById('up-' + i);
    up.classList.toggle('loaded', !!f);
    up.firstChild.nodeValue = f ? '다시 선택' : '파일 선택';
  });
  const periods = [...new Set(loaded.map(f => f.period).filter(Boolean))];
  document.getElementById('period').innerHTML = periods.length ? `조회기간 <b>${esc(periods.join(' / '))}</b>` : '';

  const main = document.getElementById('main');
  if (!loaded.length) {
    main.innerHTML = '<div class="panel start"><p class="empty">한도를 입력하고 카드사 엑셀을 불러오면 여기에 합계와 카드별 승인내역이 나와요.</p></div>';
    return;
  }

  const tx = allTx();
  const t = totals(tx);
  const manual = state.manual.reduce((s, m) => s + m.amount, 0);
  const team = t.used - t.excl - manual;
  const limit = state.limit;
  const remain = limit - team;
  const pct = limit ? Math.max(0, Math.min(100, team / limit * 100)) : 0;
  const lvl = !limit ? 'none' : remain < 0 ? 'bad' : pct >= 80 ? 'warn' : 'ok';
  const label = { none: '한도 미입력', ok: `${pct.toFixed(0)}% 사용`, warn: `${pct.toFixed(0)}% 사용 · 주의`, bad: '한도 초과' }[lvl];

  const byCard = CARDS.map(c => {
    const list = tx.filter(x => x.card === c.no);
    const s = totals(list);
    return { c, list, net: s.used - s.excl };
  });

  const manualItems = state.manual.map((m, i) =>
    `<li><span>${esc(m.memo || '수기 차감')}</span><span class="amt">-${won(m.amount)}</span><button class="x" data-i="${i}" aria-label="삭제">×</button></li>`).join('');

  main.innerHTML = `
  <div style="display:grid;gap:20px">
    <section class="panel summary">
      <div class="sum-top">
        <div class="remain"><small>유통사업부 팀케어 잔여한도</small><div class="big ${limit && remain < 0 ? 'neg' : ''}">${limit ? won(remain) : '—'}</div></div>
        <span class="state ${lvl}">${label}</span>
      </div>
      <div class="meter"><i class="${lvl === 'bad' ? 'bad' : lvl === 'warn' ? 'warn' : ''}" style="width:${pct}%"></i></div>
      <div class="sum-grid">
        <dl class="calc">
          <dt>카드 총 사용 (${t.count}건, 취소 제외)</dt><dd>${won(t.used)}</dd>
          <dt>다른 한도 사용 (제외 표시)</dt><dd class="minus">${minusWon(t.excl)}</dd>
          <dt>수기 차감</dt><dd class="minus">${minusWon(manual)}</dd>
          <dt class="total">팀케어 사용액</dt><dd class="total">${won(team)}</dd>
          <dt>한도</dt><dd>${limit ? won(limit) : '미입력'}</dd>
        </dl>
        <dl class="calc">
          ${byCard.map(b => `<dt>${esc(b.c.name)} ${b.c.no}</dt><dd>${won(b.net)}</dd>`).join('')}
        </dl>
      </div>
    </section>

    <section class="panel section">
      <h3>수기 차감 (마이너스)</h3>
      <form class="manual-form" id="manual-form">
        <div class="field"><label for="memo">메모</label><input type="text" id="memo"></div>
        <div class="field"><label for="amt">금액 (원)</label><input type="number" id="amt" min="1" step="1" required></div>
        <button class="btn-minus" type="submit" style="align-self:end">− 빼기</button>
      </form>
      ${manualItems ? `<ul class="manual-list">${manualItems}</ul>` : '<p class="empty">한 건 중 일부 금액만 뺄 때 메모와 금액을 넣으세요. 건 전체는 아래 목록에서 "제외"를 누르면 돼요.</p>'}
    </section>

    <div class="cards">${byCard.map(b => cardHTML(b.c, b.list)).join('')}</div>
  </div>`;
}

// 이벤트
const limitEl = document.getElementById('limit');
limitEl.addEventListener('input', () => {
  const v = num(limitEl.value);
  state.limit = v;
  limitEl.value = v ? v.toLocaleString('ko-KR') : '';
  render();
});
[0, 1].forEach(i => document.getElementById('file-' + i).addEventListener('change', e => {
  if (e.target.files[0]) loadFile(i, e.target.files[0]);
  e.target.value = '';
}));
const main = document.getElementById('main');
main.addEventListener('click', e => {
  const tg = e.target.closest('.toggle');
  if (tg) { const id = tg.dataset.id; state.excluded.has(id) ? state.excluded.delete(id) : state.excluded.add(id); render(); return; }
  const x = e.target.closest('.x');
  if (x) { state.manual.splice(+x.dataset.i, 1); render(); }
});
main.addEventListener('submit', e => {
  e.preventDefault();
  const amount = num(document.getElementById('amt').value);
  if (amount <= 0) return;
  state.manual.push({ memo: document.getElementById('memo').value.trim(), amount });
  render();
});

render();
</script>
</body>
</html>
